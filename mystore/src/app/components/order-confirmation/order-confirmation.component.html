<div class="confirmation-page">
  <div class="confirmation-card">
    <div class="success-icon">✅</div>
    <h1>Order Confirmed!</h1>
    <p class="subtitle">Thank you for your purchase. Your order has been placed successfully.</p>
    <div class="order-id">
      Order ID: <strong>#{{ orderId }}</strong>
    </div>
    <p class="message">
      A confirmation email will be sent shortly. Your items will be delivered within 3–5 business days.
    </p>
    <a routerLink="/" class="btn-home">Continue Shopping 🛍️</a>
  </div>
</div>
